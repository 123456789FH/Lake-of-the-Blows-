*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Lake,Tahoma,Arial,sans-serif;font-size:16px;line-height:1.75}button,input,a,summary{font:inherit}button,a,summary{touch-action:manipulation;-webkit-tap-highlight-color:transparent}button,summary{cursor:pointer}button{color:inherit}button:disabled{cursor:default;opacity:.5}a{color:inherit;text-decoration:none}button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #e08a00;outline-offset:4px}h1,h2,h3,p{margin:0}button{border:0}.icon{display:inline-block;width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle;flex:none}.small-icon{width:16px;height:16px}.defs{position:absolute;width:0;height:0;overflow:hidden}.shell{width:min(1220px,calc(100% - 72px));margin-inline:auto}header{background:var(--paper);border-bottom:1px solid var(--line)}.head{min-height:78px;display:flex;align-items:center;gap:40px}.brand{display:inline-flex;align-items:center;gap:10px;white-space:nowrap;font-family:Kufi,Lake,sans-serif;font-weight:800;font-size:20px;letter-spacing:-.6px}.brand-icon{width:48px;height:48px;flex:none;filter:drop-shadow(0 3px 0 #12334416)}nav,.tools,.btns,.row,.facts-nav{display:flex;align-items:center;gap:10px}.navlink{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:15px;min-height:41px;border-radius:13px;padding:5px 13px;color:var(--muted)}.navlink.active{background:var(--sub);color:#087151}[data-theme=dark] .navlink.active{color:#b5f7d6}.tools{margin-inline-start:auto;gap:8px}.circle,.iconbtn{display:inline-grid;place-items:center;background:var(--paper);border:1px solid var(--line);width:42px;height:42px;border-radius:50%}.iconbtn{border-radius:13px}.stars{display:inline-flex;align-items:center;gap:7px;min-height:40px;background:#fff3c9;border:1px solid #f2d780;border-radius:24px;padding:3px 12px;color:#674b0b;font-weight:700}.stars .icon{fill:#ffbd29;stroke:#a86708}.skip{position:absolute;inset-inline-start:10px;top:-140px;background:white;padding:8px;z-index:9}.skip:focus{top:4px}
main{min-height:65vh}main:focus{outline:none}.hero{isolation:isolate;position:relative;overflow:hidden;border-radius:28px;background:#b9edff var(--art) center/cover no-repeat;min-height:336px;margin:27px 0 30px;display:flex;align-items:center;box-shadow:0 4px 0 #d8e8de,0 10px 24px #2b657014;border:1px solid #8dced65c}.hero:before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(270deg,#eefeff5e 4%,#ecfbff24 38%,transparent 58%)}.hero-copy{width:51%;padding:24px clamp(24px,4.1vw,62px) 26px 10px;color:#16475f}.tag{display:inline-flex;align-items:center;gap:7px;padding:2px 12px;font-size:13px;font-weight:700;border:1px solid #91c8cc;background:#f5fffbec;border-radius:20px;color:#236570}.hero-title{font:900 clamp(44px,5.4vw,76px)/1.65 Kufi,Lake,sans-serif;letter-spacing:-2.5px;white-space:nowrap;color:#124b70;paint-order:stroke fill;-webkit-text-stroke:6px #fff9dd;filter:drop-shadow(0 4px 0 #27607663)}.hero-title span{color:#f6a119;-webkit-text-stroke:6px #fff9dd}.hero-copy p{font-weight:700;font-size:clamp(16px,1.35vw,20px);max-width:440px;margin-bottom:17px;text-shadow:0 1px 4px white}.btn,.quiet{display:inline-flex;justify-content:center;align-items:center;gap:9px;min-height:44px;border-radius:13px;font-weight:700;font-size:15px;padding:8px 17px}.btn{background:var(--green);border:1px solid var(--green-dark);color:#fff;box-shadow:0 3px 0 var(--green-dark)}.btn:hover{filter:brightness(1.08)}.btn:active{transform:translateY(2px);box-shadow:none}.hero .btn{background:#ffcb4a;color:#513906;border-color:#c28a1c;box-shadow:0 4px 0 #c28a1c;min-height:46px;padding-inline:22px}.quiet{color:var(--ink);background:var(--paper);border:1px solid var(--line)}.quiet:hover,.circle:hover,.iconbtn:hover{background:var(--nav)}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:0 0 16px}.section-head h2,.heading{font:800 clamp(22px,2.3vw,31px)/1.6 Kufi,Lake,sans-serif;letter-spacing:-.8px}.section-head p,.muted{color:var(--muted);font-size:15px}.count{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13px;white-space:nowrap;color:var(--muted)}.count .icon{color:#088773}

const main = document.getElementById('main');
const storageKey = 'duck-lake-progress-v1';
let factIndex = 0, table = null, round = null, lastResult = null, audioContext;
function loadData() {
  try { return JSON.parse(localStorage.getItem(storageKey)) || {}; }
  catch { return {}; }
}
const saved = loadData() || {};
const prefs = {sound: saved.sound !== false, dark: saved.dark === true, friend: saved.friend};
const historyList = Array.isArray(saved.history) ? saved.history.filter(r => r && typeof r.id === 'string' && (r.table === 'mix' || nums.includes(r.table)) && Number.isInteger(r.score) && Number.isInteger(r.total) && r.total > 0 && r.score >= 0 && r.score <= r.total && Number.isFinite(r.time)) : [];
let earnedStars = Math.max(Number.isSafeInteger(saved.stars) ? saved.stars : 0, historyList.reduce((sum, r) => sum + r.score, 0));
function saveData() {
  try { localStorage.setItem(storageKey, JSON.stringify({...prefs,stars:earnedStars,history:historyList})); }
  catch { /* The current session still works when browser storage is unavailable. */ }
}
const titleFor = t => t === 'mix' ? 'تحدّي البحيرة' : 'جدول '+words[t];
const passed = r => r.score / r.total >= .8;
const mastered = t => historyList.some(r => r.table === t && passed(r));
const successCount = () => earnedStars;

}
function header() {
  document.documentElement.dataset.theme = prefs.dark ? 'dark' : 'light';
  toolButton('theme',prefs.dark?'تفعيل الوضع النهاري':'تفعيل الوضع الليلي',prefs.dark?'sun':'moon',prefs.dark);
  toolButton('sound',prefs.sound?'كتم جرس الإجابة':'تشغيل جرس الإجابة',prefs.sound?'sound':'mute',prefs.sound);

function bell() {
  if (!prefs.sound) return;
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    audioContext = audioContext || new Ctx();
    const play = () => {
      if (!prefs.sound) return;
      const start = audioContext.currentTime;
      [[880,0,.11],[1760,0,.035],[1174.66,.13,.095],[2349.3,.13,.026]].forEach(([hz,offset,volume]) => {
        const o=audioContext.createOscillator(), gain=audioContext.createGain(), t=start+offset;
        o.type='sine'; o.frequency.value=hz; gain.gain.setValueAtTime(.0001,t); gain.gain.exponentialRampToValueAtTime(volume,t+.009); gain.gain.exponentialRampToValueAtTime(.0001,t+.72);
        o.connect(gain); gain.connect(audioContext.destination); o.start(t); o.stop(t+.75);
        o.onended=()=>{o.disconnect();gain.disconnect()};
      });
    };
    if (audioContext.state === 'suspended') audioContext.resume().then(play).catch(()=>{}); else play();
  } catch { /* Sound is optional on devices without Web Audio. */ }
}

  main.innerHTML = '<section class="hero" aria-labelledby="hero-title"><div class="hero-motion" aria-hidden="true"></div><div class="home-bubble" aria-hidden="true">هل نبدأ المغامرة؟</div><div class="hero-copy"><span class="tag">'+icon('book','small-icon')+'رياضيات الصف الثالث</span><h1 id="hero-title" class="hero-title">بحيرة <span>الضرب</span></h1><p>اعبر البحيرة مع رفيقك، واجمع نجمة عند كل ناتج صحيح.</p><div class="hero-actions"><a class="btn" href="#quiz/mix">ابدأ المغامرة '+icon('left')+'</a><a class="quiet" href="#table/'+next+'">استكشف الجداول</a></div></div></section><section aria-labelledby="tables"><div class="section-head"><div><h2 id="tables">اختر جدول الضرب</h2><p>استكشف مجموعات كل جدول، ثم العب مع رفيقك في البحيرة.</p></div><span class="count">'+icon('grid','small-icon')+'١١ جدولًا</span></div><div class="cards">'+nums.map(tile).join('')+'<a class="tile mixed" href="#quiz/mix"><span aria-hidden="true" class="mix-sign">×</span>'+icon('trophy','trophy-art')+'<span class="tile-label">تحدّي البحيرة</span><span class="swoop"></span><span class="arrow">'+icon('left')+'</span></a></div></section>';
}
function modelText(a,b){
  if(!a) return 'عدد المجموعات صفر، لذلك عدد النقاط كلّها صفر.';
  if(!b) return 'كلّ مجموعة فارغة. مهما كان عدد المجموعات، فمجموع النقاط صفر.';
  if(a===1) return 'لدينا مجموعة واحدة فقط، لذلك يساوي الناتج عدد النقاط فيها.';
  if(b===1) return 'في كلّ مجموعة نقطة واحدة، لذلك يساوي الناتج عدد المجموعات.';
  return 'عدد المجموعات '+toAr(a)+'، وعدد النقاط في كلّ مجموعة '+toAr(b)+'. عند جمع النقاط كلّها نحصل على '+toAr(a*b)+'.';
}
function groups(a,b){
  if(!a) return '<div class="zero">٠ مجموعات</div>';
  return Array.from({length:a},()=>'<span class="group">'+Array.from({length:b},()=>'<i class="dot"></i>').join('')+'</span>').join('');
}
function learn(n){
  main.innerHTML='<div class="topline">'+back('#home','العودة إلى البحيرة')+'</div><section class="scene-mini"><img class="portrait" src="'+faces.green+'" alt="البطّة الخضراء"><div><h1 class="heading">'+titleFor(n)+'</h1><p>غيّر العامل الثاني واكتشف كيف يتغيّر الناتج.</p></div><a class="btn" href="#quiz/'+n+'">العب في البحيرة '+icon('left')+'</a></section><div class="content-cols"><section class="panel"><h2>اختر العامل الثاني</h2><div class="chips" role="group" aria-label="العامل الثاني">'+nums.map(b=>'<button class="chip" data-factor="'+b+'" aria-pressed="'+(factIndex===b)+'">'+toAr(b)+'</button>').join('')+'</div><div class="fact" id="fact" aria-live="polite">'+math(n,factIndex)+'</div><div class="facts-nav"><button class="quiet" data-step="-1" '+(factIndex===0?'disabled':'')+'>'+icon('right')+'السابق</button><button class="quiet" data-step="1" '+(factIndex===10?'disabled':'')+'>التالي'+icon('left')+'</button></div></section><section class="panel"><h2>انظر إلى المجموعات</h2><div class="groups" id="groups" aria-hidden="true">'+groups(n,factIndex)+'</div><p id="model-text" class="explain">'+modelText(n,factIndex)+'</p></section></div><details class="panel"><summary>اعرض '+titleFor(n)+' كاملًا</summary><div class="all-facts">'+nums.map(b=>math(n,b)).join('')+'</div></details>';
}
function setFactor(index) {
  factIndex = index;
  document.querySelectorAll('[data-factor]').forEach(el=>el.setAttribute('aria-pressed',String(Number(el.dataset.factor)===index)));
  document.getElementById('fact').innerHTML=math(table,index);
  document.getElementById('groups').innerHTML=groups(table,index);
  document.getElementById('model-text').textContent=modelText(table,index);
  document.querySelector('[data-step="-1"]').disabled=index===0;
  document.querySelector('[data-step="1"]').disabled=index===10;
}
function shuffle(value) {
  const seq=value.slice();
  for(let i=seq.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[seq[i],seq[j]]=[seq[j],seq[i]]}
  return seq;
}
function choices(a,b) {
  const answer=a*b;
  const nearby=[answer+a,answer-a,answer+b,answer-b,answer+1,answer-1,answer+2,answer-2,a+b];
  const eligible=[...new Set(nearby)].filter(v => v>=0 && v<=100 && v!==answer);
  const wrong=shuffle(eligible).slice(0,3);
  for(let i=0;wrong.length<3;i++){if(i!==answer && !wrong.includes(i))wrong.push(i)}
  return shuffle([answer,...wrong]);
}
function newRound(t) {
  const multipliers=shuffle(nums), tables=t==='mix'?shuffle(nums):Array(10).fill(t);
  const questions=tables.map((a,i)=>{const b=multipliers[i];return {a,b,options:choices(a,b)}});
  round={id:Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,9),table:t,questions,index:0,answers:[]};
  lastResult=null;
}
const friends = {
  frog:   {name:'الضفدع', title:'ممرّ الأحجار', prompt:'ما ناتج العملية؟', stop:'stone'},
  wasp:   {name:'الدبور', title:'بستان الدبور', prompt:'إلى أيّ زهرة أطير؟', stop:'blossom'},
  boat:   {name:'القارب', title:'مرسى القوارب', prompt:'إلى أين أُبحر؟', stop:'buoy'},
  duck:   {name:'البطّة', title:'خور البطّة', prompt:'إلى أين أسبح؟', stop:'pad'},
  flower: {name:'الوردة', title:'رحلة وردة الماء', prompt:'إلى أين أطفو؟', stop:'pad'}
};
let friend = Object.hasOwn(friends, saved.friend) ? saved.friend : 'frog';
let journeyTimers = [];
function cancelJourneyTimers() {
  journeyTimers.forEach(clearTimeout);
  journeyTimers = [];
}
function afterLandingDelay(ms, callback) {
  const owner = round;
  journeyTimers.push(setTimeout(() => {
    if (round === owner && location.hash.startsWith('#quiz/')) callback();
  }, ms));
}
function sprite(id, className = '') {
  return '<svg class="'+className+'" aria-hidden="true" focusable="false"><use href="#'+id+'"/></svg>';
}
function shortFact(q) {
  return '<bdi class="math stone-math" dir="ltr"><span>'+toAr(q.a)+'</span><span>×</span><span>'+toAr(q.b)+'</span></bdi>';
}
function heightAt(step) {
  return [0,8,2,10,3][step % 5];
}
function positionAt(el, step) {
  el.style.setProperty('--step',step);
  el.style.setProperty('--rise',heightAt(step)+'px');
}
function friendPicker() {
  return '<div class="friends"><span class="friends-title">رفيق الرحلة</span><div class="friend-list" role="group" aria-label="اختر رفيق الرحلة">'+
    Object.entries(friends).map(([key,f])=>'<button type="button" class="friend-choice" data-friend="'+key+'" aria-pressed="'+(friend===key)+'">'+sprite('friend-'+key)+f.name+'</button>').join('')+'</div></div>';
}
function stopMarkup(q, step) {
  const finish = step === round.questions.length;
  return '<div class="stop'+(step===0?' start':'')+'" data-stop="'+step+'" style="--step:'+step+';--rise:'+heightAt(step)+'px">'+
    sprite('stop-'+friends[friend].stop,'base')+
    '<span class="stop-label">'+(q?shortFact(q):'البداية')+'</span>'+
    (finish?'<span class="stop-flag" aria-hidden="true">⚑</span>':'')+'</div>';
}
function drawQuestion() {
  const label=round.table==='mix'?'تحدّي البحيرة':'تدريب '+titleFor(round.table);
  main.innerHTML='<div class="journey"><div class="topline">'+back(round.table==='mix'?'#home':'#table/'+round.table,round.table==='mix'?'العودة إلى البحيرة':'العودة إلى الجدول')+'</div>'+
    '<section class="journey-panel" aria-labelledby="journey-title"><div class="journey-head"><div><p class="journey-kicker">'+label+'</p><h1 id="journey-title">'+friends[friend].title+'</h1></div>'+
    '<div class="round-counter"><span id="stop-count"></span><div class="track" role="progressbar" aria-label="المحطات المكتملة" aria-valuemin="0" aria-valuemax="'+round.questions.length+'" aria-valuenow="0"><i style="width:0%"></i></div></div></div>'+
    friendPicker()+'<div class="course"><div class="course-land" aria-hidden="true"></div>'+
    '<svg class="water-marks" aria-hidden="true" viewBox="0 0 1000 150" preserveAspectRatio="none"><g fill="none" stroke="#e7ffff" stroke-width="2" stroke-linecap="round"><path d="M25 42q20 4 43 0m13 0h17m45 47q29 5 59-1m142-65q14 3 32 0m10 0h12m96 61q26 5 66-2m18-43q14 3 35 0m84 65q32 6 66-1m106-70q19 3 47 0m31 82 32-1M49 131q19 3 41 0m204-17 28-1m103 26 41-1m143-19q13 2 30-1m160-82 18-1"/></g></svg>'+
    '<div class="speech-card"><span class="say" id="say"></span><span id="spoken-fact"></span></div>'+
    '<div class="course-track" aria-hidden="true">'+stopMarkup(null,0)+round.questions.map((q,i)=>stopMarkup(q,i+1)).join('')+
    '<div class="traveller friend-'+friend+'" style="--step:0;--rise:0px"><div class="actor-motion"><div class="actor-body">'+sprite('friend-'+friend)+'</div></div></div></div></div>'+
    '<div class="play-controls"><div id="choices" class="options" role="group" aria-label="خيارات الإجابة"></div>'+
    '<p class="play-note" id="play-note" role="status" aria-atomic="true"></p><div class="play-summary" id="play-summary"></div></div></section></div>';
  showStation();
}
function pointCamera() {
  const track=main.querySelector('.course-track');
  if(!track || !round) return;
  const css=getComputedStyle(track);
  const shownAhead=Math.floor((100-parseFloat(css.getPropertyValue('--edge'))-8)/parseFloat(css.getPropertyValue('--gap')));
  track.style.setProperty('--camera',Math.min(round.index,Math.max(0,round.questions.length-shownAhead)));
}
function showStation(keyboard = false) {
  round.phase='asking';
  round.firstValue=null;
  const q=round.questions[round.index];
  const nth=round.index+1;
  const counter='المحطة '+toAr(nth)+' من '+toAr(round.questions.length);
  document.getElementById('stop-count').textContent=counter;
  document.getElementById('say').textContent=friends[friend].prompt;
  document.getElementById('spoken-fact').innerHTML=math(q.a,q.b,'؟');
  const choicesHost=document.getElementById('choices');
  choicesHost.setAttribute('aria-label',counter+'، ما ناتج '+toAr(q.a)+' ضرب '+toAr(q.b)+'؟');
  choicesHost.innerHTML=q.options.map(v=>'<button type="button" class="option" data-value="'+v+'">'+toAr(v)+'</button>').join('');
  main.querySelector('[data-stop="'+nth+'"]').classList.add('target');
  main.querySelectorAll('[data-friend]').forEach(el=>el.disabled=false);
  const note=document.getElementById('play-note');
  note.dataset.tone=''; note.textContent=round.index===0?'اختر ناتج العملية لتبدأ الرحلة.':'اختر ناتج العملية في المحطة المضيئة.';
  pointCamera();
  if(keyboard) choicesHost.firstElementChild.focus({preventScroll:true});
}
function selectFriend(key) {
  if(!Object.hasOwn(friends,key) || !round || round.phase!=='asking') return;
  friend=key; prefs.friend=key; saveData();
  const f=friends[key];
  document.getElementById('journey-title').textContent=f.title;
  document.getElementById('say').textContent=f.prompt;
  const actor=main.querySelector('.traveller');
  actor.className='traveller friend-'+key;
  actor.querySelector('.actor-body').innerHTML=sprite('friend-'+key);
  main.querySelectorAll('.stop .base use').forEach(el=>el.setAttribute('href','#stop-'+f.stop));
  main.querySelectorAll('[data-friend]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.friend===key)));
}
function hintFor(q) {
  if(q.a===0 || q.b===0) return 'عندما يكون أحد العاملين صفرًا، تكون المجموعات فارغة أو يكون عددها صفرًا.';
  if(q.a===1 || q.b===1) return 'عند الضرب في واحد يبقى العدد الآخر كما هو.';
  const smaller=Math.min(q.a,q.b), larger=Math.max(q.a,q.b);
  return 'ابدأ من '+toAr((smaller-1)*larger)+'، ثم أضف '+toAr(larger)+' مرّة واحدة.';
}
function celebrateAt(step, value) {
  const landing=document.createElement('div');
  landing.className='landing';
  positionAt(landing,step);
  landing.innerHTML='<b class="reward-bubble">'+toAr(value)+'</b>'+
    [[-49,-21],[46,-19],[-32,-47],[29,-48],[-55,4],[54,5],[1,-56]].map(([dx,dy],i)=>
      '<i class="spark" style="--dx:'+dx+'px;--dy:'+dy+'px;--turn:'+(i%2?32:-28)+'deg">★</i>').join('');
  main.querySelector('.course-track').append(landing);
}
function answer(value, keyboard = false) {
  if(!round || round.phase!=='asking' || lastResult) return;
  const q=round.questions[round.index];
  const btn=main.querySelector('[data-value="'+value+'"]');
  if(!btn || btn.disabled || !q.options.includes(value)) return;
  const note=document.getElementById('play-note');
  if(round.firstValue===null) round.firstValue=value;
  if(value!==q.a*q.b) {
    btn.disabled=true; btn.classList.add('incorrect');
    note.dataset.tone='hint'; note.textContent='حاول مرة أخرى. '+hintFor(q);
    if(keyboard) main.querySelector('[data-value]:not(:disabled)').focus({preventScroll:true});
    return;
  }
  round.phase='moving';
  const firstTry=round.firstValue===value, step=round.index+1, last=step===round.questions.length;
  round.answers.push({a:q.a,b:q.b,value:round.firstValue,correct:firstTry});
  main.querySelectorAll('[data-value],[data-friend]').forEach(el=>el.disabled=true);
  btn.classList.add('correct');
  const actor=main.querySelector('.traveller');
  actor.classList.remove('arrived'); actor.classList.add('moving'); positionAt(actor,step);
  document.getElementById('say').textContent='أحسنت!';
  note.dataset.tone='success'; note.textContent='إجابة صحيحة!';
  const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const travelMs=reduced?50:830;
  bell();
  earnedStars++;saveData();header();
  if(last) completeRound();
  afterLandingDelay(travelMs,()=>{
    actor.classList.remove('moving');
    actor.classList.add('arrived');
    const stop=main.querySelector('[data-stop="'+step+'"]');
    stop.classList.remove('target');stop.classList.add('visited');
    stop.querySelector('.stop-label').innerHTML=math(q.a,q.b);
    document.getElementById('spoken-fact').innerHTML=math(q.a,q.b);
    celebrateAt(step,value);
    note.innerHTML='★ '+math(q.a,q.b)+(last?' · اكتملت الرحلة!':' · نجمة جديدة!');
    const progress=main.querySelector('.track');
    progress.setAttribute('aria-valuenow',String(step));progress.firstElementChild.style.width=(step/round.questions.length*100)+'%';
    document.getElementById('play-summary').innerHTML='<details><summary>كيف وجدنا الناتج '+toAr(value)+'؟</summary><p>'+math(q.a,q.b)+'<br>'+modelText(q.a,q.b)+'</p></details>';
  });
  afterLandingDelay(travelMs+1420,()=>{
    if(last) {location.hash='result';return}
    main.querySelector('.landing')?.remove();
    round.index++;
    const shouldFocus=keyboard && (document.activeElement===document.body || document.activeElement===btn);
    showStation(shouldFocus);
  });
}
window.addEventListener('resize',pointCamera);

function completeRound() {
  if(lastResult) return;
  const r={id:round.id,table:round.table,score:round.answers.filter(x=>x.correct).length,total:round.questions.length,time:Date.now()};
  historyList.push(r);lastResult=r;saveData();
}
function resultPage() {
  const r=lastResult;
  if(!r){location.replace('#home');return}
  const percent=toAr(Math.round(r.score/r.total*100));
  const errors=round.answers.filter(q=>!q.correct);
  main.innerHTML='<div class="results-wrap"><div class="topline">'+back('#home','العودة إلى البحيرة')+'</div><section class="panel result">'+icon(passed(r)?'trophy':'medal','big-trophy')+'<h1>'+(passed(r)?'أحسنت، أتممت التحدّي!':'أكملت الجولة!')+'</h1><p>'+titleFor(r.table)+'</p><div class="score">'+toAr(r.score)+' من '+toAr(r.total)+'</div><p>نسبة الإجابات الصحيحة من المحاولة الأولى '+percent+'٪</p>'+(passed(r)?certificateFields():'<p class="muted">تُمنح الشهادة عند حلّ ٨٠٪ من المحطات من المحاولة الأولى.</p>')+'<div class="btns"><button class="btn" id="retry">جولة جديدة '+icon('left')+'</button><a class="quiet" href="#progress">إنجازاتي '+icon('medal')+'</a></div></section>'+(errors.length?'<details class="panel" open><summary>محطات راجعناها معًا</summary><div class="review">'+errors.map(q=>'<div>'+math(q.a,q.b)+'<small>محاولتك الأولى '+toAr(q.value)+'</small></div>').join('')+'</div></details>':'')+'</div>';
}
function certificateFields(){return '<div class="cert-fields"><label for="pupil-name">الاسم على الشهادة</label><input id="pupil-name" maxlength="60" placeholder="اكتب الاسم (اختياري)" autocomplete="off"><button type="button" class="quiet" id="print-cert">'+icon('print')+'طباعة الشهادة</button></div>'}

  cert.querySelector('.cert-name').textContent=name;
  window.print();
}
function progress() {
  const won=nums.filter(mastered);
  const records=historyList.slice().reverse().slice(0,15);
  main.innerHTML='<div class="topline">'+back('#home','العودة إلى البحيرة')+'</div><section class="scene-mini"><img class="portrait yellow" src="'+faces.yellow+'" alt="البطّة الصفراء"><div><h1 class="heading">إنجازاتي</h1><p>هنا تجد نجومك والجداول التي أتقنتها على هذا الجهاز.</p></div></section><div class="achievement"><div class="panel stat"><b>'+toAr(successCount())+' ⭐</b><span>نجوم الإجابات الصحيحة</span></div><div class="panel stat"><b>'+toAr(won.length)+' / ١١</b><span>جداول متقنة</span></div><div class="panel stat"><b>'+toAr(historyList.length)+'</b><span>جولات مكتملة</span></div></div><section class="panel"><h2>الجداول التي أتقنتها</h2><p class="muted">أجب عن ٨٠٪ من الأسئلة أو أكثر من المحاولة الأولى لتحصل على نجمة الجدول.</p><div class="medals">'+nums.map(n=>'<a class="medal '+(mastered(n)?'done':'')+'" href="#table/'+n+'">'+(mastered(n)?'★ ':'')+titleFor(n)+'</a>').join('')+'</div></section><section class="panel" style="margin-top:15px"><h2>آخر الجولات</h2>'+(records.length?records.map((r,i)=>'<div class="record"><strong>'+titleFor(r.table)+'</strong><span>'+toAr(r.score)+' من '+toAr(r.total)+'</span><small>'+new Intl.DateTimeFormat('ar-SA',{day:'numeric',month:'short'}).format(r.time)+'</small>'+(passed(r)?'<button class="quiet" data-record="'+i+'">'+icon('print','small-icon')+'الشهادة</button>':'')+'</div>').join(''):'<div class="empty"><p>ستظهر نتيجتك هنا بعد إكمال أول جولة.</p><a class="back" href="#home">اختر جدولًا '+icon('left')+'</a></div>')+'<div id="old-cert"></div></section>';
}
let oldCertificate = null;
main.addEventListener('click',e=>{
  const el=e.target.closest('button');if(!el)return;
  if(el.hasAttribute('data-friend'))selectFriend(el.dataset.friend);
  else if(el.hasAttribute('data-factor'))setFactor(Number(el.dataset.factor));
  else if(el.hasAttribute('data-step'))setFactor(Math.max(0,Math.min(10,factIndex+Number(el.dataset.step))));
  else if(el.hasAttribute('data-value'))answer(Number(el.dataset.value),e.detail===0);
  else if(el.id==='retry' && lastResult){location.hash='quiz/'+lastResult.table}
  else if(el.hasAttribute('data-record')){
    oldCertificate=historyList[historyList.length-1-Number(el.dataset.record)];
    const host=document.getElementById('old-cert');host.innerHTML=certificateFields();document.getElementById('pupil-name').focus();
  } else if(el.id==='print-cert')printCertificate(location.hash==='#progress'?oldCertificate:lastResult);
});
let lastHash;
function route() {
  const hash=location.hash.slice(1) || 'home';
  if(hash==='main'){main.focus();return}
  if(hash===lastHash)return;
  cancelJourneyTimers();
  lastHash=hash; oldCertificate=null;
  let match;
  if(hash==='home'){table=null;round=null;lastResult=null;home()}
  else if(hash==='progress'){table=null;round=null;lastResult=null;progress()}
  else if((match=/^table\/(10|[0-9])$/.exec(hash))){table=Number(match[1]);round=null;lastResult=null;factIndex=0;learn(table)}
  else if((match=/^quiz\/(mix|10|[0-9])$/.exec(hash))){const t=match[1]==='mix'?'mix':Number(match[1]);newRound(t);drawQuestion()}
  else if(hash==='result' && lastResult){resultPage()}
  else{location.replace('#home');return}
  document.querySelectorAll('[data-nav]').forEach(el=>{
    const active=el.dataset.nav===(hash==='progress'?'progress':'home');el.classList.toggle('active',active);
    if(active)el.setAttribute('aria-current','page');else el.removeAttribute('aria-current');
  });
  header();main.focus({preventScroll:true});window.scrollTo(0,0);
}
document.querySelector('.skip').addEventListener('click',e=>{e.preventDefault();main.focus()});
window.addEventListener('hashchange',route);route();

</script>
</body>
</html>
